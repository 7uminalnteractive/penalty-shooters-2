<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Editor de times — Penalty Shooters 2</title>
<style>
:root{--bg:#0e1f17;--card:#16301f;--line:#2b5a38;--fg:#f2f7f3;--mut:#9cb8a4;--acc:#ffd23f;--bad:#ff6b6b;box-sizing:border-box}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.4 system-ui,Arial,sans-serif;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
header{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding:10px 12px}
h1{font-size:18px;margin:0 0 8px}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
button,.btn{font:inherit;font-weight:700;border:0;border-radius:10px;padding:10px 14px;background:var(--acc);color:#1a1a1a;cursor:pointer;text-decoration:none;display:inline-block}
.sec{background:transparent;color:var(--fg);border:1px solid var(--line)}.dng{background:transparent;color:var(--bad);border:1px solid var(--bad)}
input[type=search],input[type=text],textarea{width:100%;font:inherit;color:var(--fg);background:#0a1812;border:1px solid var(--line);border-radius:10px;padding:10px}
textarea{min-height:230px;resize:vertical}
main{padding:12px;max-width:720px;margin:auto}
.t{display:flex;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px;margin:8px 0;cursor:pointer;width:100%;text-align:left;color:var(--fg);font-weight:400}
.t img{width:44px;height:44px;object-fit:contain;flex:none}.t b{display:block}.t small{color:var(--mut)}
.mod{position:fixed;inset:0;background:rgba(0,0,0,.7);display:none;z-index:10;overflow:auto}
.mod.on{display:block}.box{background:var(--bg);border:1px solid var(--line);border-radius:16px;max-width:560px;margin:16px auto;padding:16px}
label{display:block;color:var(--mut);font-size:14px;margin:12px 0 4px}.logo{display:flex;gap:12px;align-items:center}.logo img{width:72px;height:72px;object-fit:contain;background:#0a1812;border-radius:12px;border:1px solid var(--line)}
.hint{color:var(--mut);font-size:13px}#msg{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:var(--acc);color:#111;font-weight:700;padding:10px 16px;border-radius:999px;display:none;z-index:20}
</style></head><body>
<header><h1>Editor de times · Brasil</h1>
<div class="row"><a class="btn" href="index.html">▶ Jogar</a><button class="sec" id="exp">Exportar</button><button class="sec" id="imp">Importar</button><button class="dng" id="rst">Restaurar tudo</button><input type="file" id="file" accept="application/json" hidden></div>
<div style="margin-top:8px"><input type="search" id="q" placeholder="Buscar time…"></div></header>
<main><p class="hint">As edições ficam salvas neste aparelho e valem na próxima vez que você abrir o jogo. Nome e sigla aparecem nos menus; logo e jogadores aparecem na partida.</p><div id="list"></div></main>
<div class="mod" id="mod"><div class="box">
<div class="logo"><img id="lp" alt=""><div><button id="up">Enviar logo</button> <button class="sec" id="auto">Logo automática</button><div class="hint" style="margin-top:6px">Imagem quadrada funciona melhor.</div></div></div>
<input type="file" id="lf" accept="image/*" hidden>
<label>Nome do time (até 15 letras)</label><input type="text" id="n" maxlength="15" autocapitalize="characters">
<label>Sigla (até 5 letras)</label><input type="text" id="s" maxlength="5" autocapitalize="characters">
<label>Jogadores (um por linha, até 11) <button class="sec" id="gen" style="padding:4px 10px;font-size:13px">Gerar nomes</button></label><textarea id="p"></textarea>
<div class="row" style="margin-top:14px"><button id="sv">Salvar</button><button class="sec" id="cl">Cancelar</button><button class="dng" id="rt">Restaurar este time</button></div></div></div>
<div id="msg"></div>
<script>window.PS2_EDITOR=true</script><script src="ps2-mod.js"></script>
<script>
(function(){
var P=window.PS2,$=function(i){return document.getElementById(i)},teams=[],cur=-1,logo=null,data;
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function msg(t){var m=$('msg');m.textContent=t;m.style.display='block';clearTimeout(msg.t);msg.t=setTimeout(function(){m.style.display='none'},1800)}
function info(i){var o=teams[i],e=data.t[i]||{};return{n:e.n||o[0][0],s:e.s||o[4][0],l:e.l||null,p:(e.p&&e.p.length)?e.p:null,kit:o[2][0],on:o[0][0],os:o[4][0]}}
function logoOf(i){var x=info(i);return x.l||P.crestURL(x.kit,x.n)}
function render(){var q=$('q').value.trim().toUpperCase(),h='';teams.forEach(function(t,i){var x=info(i);if(q&&x.n.toUpperCase().indexOf(q)<0&&x.s.toUpperCase().indexOf(q)<0)return;
h+='<button class="t" data-i="'+i+'"><img alt="" src="'+esc(logoOf(i))+'"><span><b>'+esc(x.n)+'</b><small>'+esc(x.s)+' · '+(x.p?x.p.length+' jogadores':'jogadores automáticos')+(data.t[i]?' · editado':'')+'</small></span></button>'});$('list').innerHTML=h||'<p class="hint">Nenhum time encontrado.</p>'}
function open(i){cur=i;var x=info(i);logo=x.l;$('n').value=x.n;$('s').value=x.s;$('p').value=(x.p||P.defPlayers(i)).join('\n');$('lp').src=logo||P.crestURL(x.kit,x.n);$('mod').classList.add('on')}
function close(){$('mod').classList.remove('on');cur=-1}
$('list').addEventListener('click',function(e){var b=e.target.closest('.t');if(b)open(+b.dataset.i)});
$('q').addEventListener('input',render);$('cl').onclick=close;
$('up').onclick=function(){$('lf').click()};
$('lf').onchange=function(){var f=this.files[0];if(!f)return;var r=new FileReader();r.onload=function(){var im=new Image();im.onload=function(){var c=document.createElement('canvas');c.width=c.height=128;var g=c.getContext('2d'),k=Math.min(128/im.width,128/im.height),w=im.width*k,h=im.height*k;g.drawImage(im,(128-w)/2,(128-h)/2,w,h);logo=c.toDataURL('image/png');$('lp').src=logo};im.onerror=function(){msg('Não consegui ler essa imagem')};im.src=r.result};r.readAsDataURL(f);this.value=''};
$('auto').onclick=function(){logo=null;var x=info(cur);$('lp').src=P.crestURL(x.kit,$('n').value||x.n)};
$('gen').onclick=function(){$('p').value=P.defPlayers(cur).join('\n')};
$('sv').onclick=function(){var e={},o=teams[cur],n=$('n').value.trim().toUpperCase().slice(0,15),s=$('s').value.trim().toUpperCase().slice(0,5),p=$('p').value.split('\n').map(function(v){return v.trim()}).filter(Boolean).slice(0,11);
if(n&&n!==o[0][0])e.n=n;if(s&&s!==o[4][0])e.s=s;if(logo)e.l=logo;if(p.length&&p.join('|')!==P.defPlayers(cur).join('|'))e.p=p;
if(Object.keys(e).length)data.t[cur]=e;else delete data.t[cur];P.save(data);close();render();msg('Salvo!')};
$('rt').onclick=function(){if(cur>=0&&confirm('Restaurar este time ao padrão?')){delete data.t[cur];P.save(data);close();render();msg('Time restaurado')}};
$('rst').onclick=function(){if(confirm('Apagar TODAS as edições de times?')){data={t:{}};P.save(data);render();msg('Tudo restaurado')}};
$('exp').onclick=function(){var a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(data)],{type:'application/json'}));a.download='ps2-times-brasil.json';a.click()};
$('imp').onclick=function(){$('file').click()};
$('file').onchange=function(){var f=this.files[0];if(!f)return;var r=new FileReader();r.onload=function(){try{var j=JSON.parse(r.result);if(!j||typeof j.t!=='object')throw 0;data={t:j.t};P.save(data);render();msg('Importado!')}catch(x){msg('Arquivo inválido')}};r.readAsText(f);this.value=''};
data=P.load();if(!data.t)data={t:{}};
Promise.all([P.loadColors(),fetch('teams_br2.json').then(function(r){return r.json()})]).then(function(a){teams=a[1].data;render()}).catch(function(){$('list').innerHTML='<p class="hint">Não consegui carregar a lista de times.</p>'});
})();
</script></body></html>
